plugins {
    id 'com.android.application'
}

android {
    namespace = "com.pit.pit"
    compileSdkVersion 36
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId "com.pit.pit"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86", "riscv64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }

    androidResources {
        noCompress 'unicornarm_a32', 'unicornarm_a64', 'unicornarm_i32', 'unicornarm_i64', 'unicornarm_r64'
    }

    // 16 KB page support: keep .so files uncompressed and page-aligned in
    // the APK so Android 15+ devices with 16 KB pages can mmap them
    // directly. AGP 8.5+ does this by default, but we set it explicitly
    // because the Gradle defaults can silently flip back when buildToolsVersion
    // or other settings change.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
