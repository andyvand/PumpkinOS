# PumpkinOS boot options for the Nintendo GameCube.
#
# This file is read from the directory holding pumpkinos.dol before the
# command line (which a loader may not provide at all). One or more options
# per line, separated by blanks; '#' starts a comment. The options are those
# of the command line, for example:
#
#   -d 2            trace level log
#   -nonet          do not bring the Broadband Adapter up
#   -nodvd          do not look for a disc
#   -gecko          log to a USB Gecko in memory card slot B
#   -ramdisk        run from the ARAM RAM disk even when an SD card is present
#   -app MemoPad    start Memo Pad instead of the Launcher
#
# See README.md for the whole list.
