# PumpkinOS for the PlayStation 2: boot options.
#
# This file is read from the directory PUMPKINOS.ELF was started from (a USB
# stick, a memory card, a disc...) before the command line, which loaders
# usually leave empty. One or more options per line, '#' starts a comment.
# The options are the ones of the command line, see README.md:
#
#   -memcard                 keep the PumpkinOS home (vfs, tmp) on the first
#                            formatted memory card instead of the RAM disk
#                            (it then persists, but a card is very slow)
#   -home mass:/PumpkinOS/   keep the home on the USB stick instead
#   -ramdisk 4096            let the RAM disk hold up to 4MB (default 3072 KB)
#   -log mass:/pumpkin.log   write the log there (from a disc it goes to the
#                            EE console otherwise)
#   -pal / -ntsc             force the TV mode (default: the console's region)
#   -progressive             480p over a component cable
#   -nonet                   do not bring the network adapter up
#   -app <name>              start this application instead of the Launcher
#   -d 0                     log errors only (1 = info, 2 = trace)
#   -seed                    copy vfs/ from the boot directory again (a
#                            home that persists)
