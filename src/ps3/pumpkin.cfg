# PumpkinOS for the PlayStation 3: boot options.
#
# This file is read from the directory EBOOT.BIN was started from (USRDIR of
# the installed package or of the disc) before the command line, which the
# XMB leaves empty. One or more options per line, '#' starts a comment. The
# options are the ones of the command line, see README.md:
#
#   -home /dev_usb000/PumpkinOS/   keep the home (vfs, tmp, the log) there
#                                  instead of /dev_hdd0/PumpkinOS/
#   -seed                          copy vfs/ from USRDIR to the home again
#   -nonet                         do not wait for the network connection
#   -app <name>                    start this application instead of the
#                                  Launcher
#   -hdepth 32                     32-bit host surface (default 16)
#   -d 0                           log errors only (1 = info, 2 = trace)
