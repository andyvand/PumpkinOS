# PumpkinOS for classic Mac OS: start-up options.
#
# This file is read from the folder that holds the PumpkinOS application.
# One or more options per line, '#' starts a comment:
#
#   -width 320 -height 544    the PumpkinOS window (default: 320x544, the
#                             320x320 screen with the input area below it;
#                             320x320 without the input area when the main
#                             screen is too small for a 544 pixel tall
#                             window, e.g. 640x480)
#   -dia 0 -height 320        no dynamic input area (graffiti, buttons)
#   -density 72 -width 160 -height 272
#                             low density (the default is 144: the 320x320
#                             double density screen of the later Palms)
#   -app <name>               start this application instead of the Launcher
#   -nonet                    do not use TCP/IP
#   -log <path>               log file (default pumpkin.log next to the
#                             application, "stderr" for pumpkin.err)
#   -d 0                      log errors only (1 = info, 2 = trace)
