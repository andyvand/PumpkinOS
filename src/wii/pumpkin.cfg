# PumpkinOS boot options for the Nintendo Wii.
#
# This file is read from the directory holding boot.dol before the command
# line (the <arguments> of meta.xml, which the Homebrew Channel passes; other
# loaders may pass none). One or more options per line, separated by
# blanks; '#' starts a comment. The options are those of the command line,
# for example:
#
#   -d 2            trace level log
#   -nonet          do not bring the network up
#   -gecko          log to a USB Gecko in memory card slot B
#   -ramdisk        run from the MEM2 RAM disk even when an SD card is present
#   -app MemoPad    start Memo Pad instead of the Launcher
#
# See README.md for the whole list.
