# PumpkinOS for the Wii U: boot options.
#
# This file is read from the bundle / title content (or from the directory
# of pumpkinos.rpx in the Homebrew Launcher), then from the home
# (sd:/wiiu/pumpkinos/pumpkin.cfg: copy it there to change the options of
# the WUHB or the installed title, whose content is read-only). One or more
# options per line, '#' starts a comment. The options are the ones of the
# command line, see README.md:
#
#   -seed                          copy vfs/ from the content to the home again
#   -nonet                         do not wait for the network connection
#   -app <name>                    start this application instead of the
#                                  Launcher
#   -hdepth 32                     32-bit host surface (default 16)
#   -d 0                           log errors only (1 = info, 2 = trace)
